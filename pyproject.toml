[project]
name = "hortator-council"
version = "0.1.0"
description = "An observable council of independent Discord applications"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "discord.py>=2.5,<3",
  "httpx>=0.28,<1", "aiohttp>=3.11,<4", "cryptography>=44,<49",
  "pydantic>=2.10,<3", "tiktoken>=0.9,<1", "jsonschema>=4.23,<5"
]
[project.scripts]
hortator = "hortator.cli:main"
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["hortator"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
